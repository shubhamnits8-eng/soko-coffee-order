<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SŌKO Admin</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/brand.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--sw);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}.top .wm b{font-size:20px}.tabs{display:flex;gap:4px;flex:1}.tabs button{border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:500;color:var(--esp)}.tabs button.on{background:var(--teal);color:#fff}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
main{padding:18px;max-width:1200px;margin:auto}.card{background:var(--sw);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #3328200d}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}h3{margin:0 0 10px;font:600 15px 'Poppins';letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.o{border-left:5px solid var(--car)}.o.new{border-color:var(--red);animation:p 1.2s 3}@keyframes p{50%{background:#fbe9e5}}.o h4{margin:0;display:flex;justify-content:space-between}.o ul{margin:8px 0;padding-left:18px}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:8px 12px;font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7d6f}td input[type=number]{width:84px;padding:6px 8px}
.sw{position:relative;width:42px;height:24px;display:inline-block}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#cfc4ac;border-radius:24px;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--teal)}.sw input:checked+span:before{transform:translateX(18px)}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--teal);color:var(--iv);display:grid;place-items:center;overflow:hidden;font-family:serif}.thumb img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:30;padding:14px}.modal.on{display:grid}.mb{background:var(--sw);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}.g{display:grid;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:500;color:#6B5E52;display:block;margin-bottom:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--esp);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:40}.toast.err{background:var(--red)}.warn{background:#fff3d6;border:1px solid #e8c874;padding:10px 14px;border-radius:10px;margin-bottom:12px}
.login{max-width:340px;margin:12vh auto;text-align:center}.mut{color:#8a7d6f;font-size:13px}.hide{display:none!important}
</style></head><body>
<div id="login" class="login"><div class="wm"><b style="font-size:44px">SŌKO</b><small>COFFEE · ADMIN</small></div><div class="g" style="margin-top:28px"><input id="pw" type="password" placeholder="Admin password" onkeydown="event.key==='Enter'&&doLogin()" autocomplete="current-password"><button class="btn" onclick="doLogin()">Log in</button><div id="le" class="mut" style="color:var(--red)"></div></div></div>
<div id="app" class="hide"><div class="top"><div class="wm"><b>SŌKO</b><small>COFFEE</small></div><div class="tabs"><button data-t="orders">Orders<span id="nb" class="badge hide"></span></button><button data-t="menu">Menu</button><button data-t="tables">Tables & QR</button><button data-t="settings">Settings</button></div><button class="btn alt" id="snd" onclick="enableAlerts()">🔔 Enable alerts</button><button class="btn alt" onclick="logout()">Log out</button></div><main id="main"></main></div>
<div class="modal" id="md"><div class="mb" id="mb"></div></div><div class="toast" id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=sessionStorage.getItem('sk_admin'),S=null,tab='orders',es=null,audio=null;
const inr=n=>'₹'+n;
function toast(m,e){const t=$('#ts');t.textContent=m;t.className='toast'+(e?' err':'');t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3200)}
async function api(u,m='GET',b){const r=await fetch('/api/admin'+u,{method:m,headers:{'Content-Type':'application/json','x-admin-token':tok||''},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&u!=='/login'){logout(true);throw Error(j.error)}if(!r.ok)throw Error(j.error||'Error');return j}
async function doLogin(){try{const j=await api('/login','POST',{password:$('#pw').value});tok=j.token;sessionStorage.setItem('sk_admin',tok);start()}catch(e){$('#le').textContent=e.message}}
function logout(x){sessionStorage.removeItem('sk_admin');tok=null;if(es)es.close();$('#app').classList.add('hide');$('#login').classList.remove('hide');if(x)$('#le').textContent='Session expired. Please log in again.'}
async function start(){
  try{S=await api('/state')}catch{return}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  if(es)es.close();es=new EventSource('/api/admin/stream?k='+encodeURIComponent(tok));
  es.addEventListener('order',e=>{const o=JSON.parse(e.data);S.orders.push(o);beep();notify(o);if(tab==='orders')draw();else badge();toast(`New order ${o.no} · ${o.table}`)});
  es.onerror=()=>{};document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});draw()
}
async function refresh(){try{S=await api('/state');draw()}catch{}}
function enableAlerts(){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();beep();$('#snd').textContent='🔔 Alerts on'}
function beep(){try{if(!audio)return;[0,.25,.5].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.3,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.2);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.2)})}catch{}}
function notify(o){if('Notification' in window&&Notification.permission==='granted')new Notification(`New order ${o.no} · ${o.table}`,{body:o.items.map(l=>`${l.qty} × ${l.name}`).join(', ')})}
const newCount=()=>S.orders.filter(o=>o.status==='new').length;
function badge(){const n=newCount(),b=$('#nb');b.textContent=n;b.classList.toggle('hide',!n)}
function draw(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));badge();$('#main').innerHTML=(S.defaultPassword?'<div class="warn">⚠ You are using the default admin password. Change it in <b>Settings</b> now.</div>':'')+({orders:vOrders,menu:vMenu,tables:vTables,settings:vSettings})[tab]()}
// ---- orders ----
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
function oc(o){const nx={new:['preparing','Start preparing'],preparing:['ready','Mark ready'],ready:['served','Mark served']}[o.status];
  return `<div class="card o ${o.status}"><h4><span>${esc(o.table)}</span><span class="mut">${esc(o.no)} · ${ago(o.createdAt)}</span></h4><ul>${o.items.map(l=>`<li><b>${l.qty} ×</b> ${esc(l.name)}</li>`).join('')}</ul>${o.note?`<div class="mut">📝 ${esc(o.note)}</div>`:''}${o.customer.name||o.customer.phone?`<div class="mut">👤 ${esc(o.customer.name)} ${esc(o.customer.phone)}</div>`:''}<div style="margin:6px 0"><b>${inr(o.total)}</b></div><div class="acts">${nx?`<button class="btn" onclick="setSt(${o.id},'${nx[0]}')">${nx[1]}</button>`:''}${['new','preparing','ready'].includes(o.status)?`<button class="btn alt" onclick="confirm('Cancel this order?')&&setSt(${o.id},'cancelled')">Cancel</button>`:''}</div></div>`}
function vOrders(){const by=s=>S.orders.filter(o=>o.status===s).reverse(),done=S.orders.filter(o=>['served','cancelled'].includes(o.status)).slice(-15).reverse();
  return `<div class="cols">${['new','preparing','ready'].map(s=>`<div><h3>${{new:'New',preparing:'Preparing',ready:'Ready'}[s]} (${by(s).length})</h3>${by(s).map(oc).join('')||'<div class="mut">None</div>'}</div>`).join('')}</div><h3 style="margin-top:24px">Recent</h3><div class="card"><table>${done.map(o=>`<tr><td>${esc(o.no)}</td><td>${esc(o.table)}</td><td>${o.items.map(l=>l.qty+'× '+esc(l.name)).join(', ')}</td><td>${inr(o.total)}</td><td>${o.status}</td></tr>`).join('')||'<tr><td class="mut">No completed orders yet</td></tr>'}</table></div>`}
async function setSt(id,s){try{const o=await api('/orders/'+id,'PATCH',{status:s});Object.assign(S.orders.find(x=>x.id===id),o);draw()}catch(e){toast(e.message,1)}}
// ---- menu ----
function vMenu(){const cats=[...new Set([...S.categories,...S.items.map(i=>i.category)])];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Menu (${S.items.length} dishes)</h3><button class="btn" onclick="editItem()">+ Add dish</button></div>`+cats.map(c=>{const its=S.items.filter(i=>i.category===c);return its.length?`<div class="card"><h3>${esc(c)}</h3><table><tr><th></th><th>Dish</th><th>Price ₹</th><th>On today's menu</th><th>In stock</th><th></th></tr>${its.map(i=>`<tr><td><div class="thumb">${i.image?`<img src="${esc(i.image)}" alt="">`:esc(i.name[0])}</div></td><td><span class="dot ${i.diet}"></span> ${esc(i.name)}</td><td><input type="number" min="0" step="1" value="${i.price}" onchange="patch(${i.id},{price:this.value})"></td><td><label class="sw"><input type="checkbox" ${i.today?'checked':''} onchange="patch(${i.id},{today:this.checked})"><span></span></label></td><td><label class="sw"><input type="checkbox" ${i.inStock?'checked':''} onchange="patch(${i.id},{inStock:this.checked})"><span></span></label></td><td><button class="btn alt" style="padding:6px 12px" onclick="editItem(${i.id})">Edit</button></td></tr>`).join('')}</table></div>`:''}).join('')}
async function patch(id,p){try{const it=await api('/items/'+id,'PUT',p);Object.assign(S.items.find(x=>x.id===id),it);toast('Saved')}catch(e){toast(e.message,1);refresh()}}
function editItem(id){const i=S.items.find(x=>x.id===id)||{name:'',category:S.categories[0],price:'',desc:'',ingredients:'',diet:'veg',inStock:true,today:true,image:''};
  $('#mb').innerHTML=`<h3>${id?'Edit':'Add'} dish</h3><div class="g"><div><label>Name</label><input id="f_n" value="${esc(i.name)}" maxlength="80"></div><div class="g2"><div><label>Category</label><input id="f_c" list="cl" value="${esc(i.category)}"><datalist id="cl">${S.categories.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>Price (₹)</label><input id="f_p" type="number" min="0" value="${i.price}"></div></div><div><label>Description</label><textarea id="f_d" rows="2" maxlength="300">${esc(i.desc)}</textarea></div><div><label>Ingredients</label><textarea id="f_i" rows="2" maxlength="300">${esc(i.ingredients)}</textarea></div><div class="g2"><div><label>Type</label><select id="f_t"><option value="veg" ${i.diet==='veg'?'selected':''}>Vegetarian</option><option value="egg" ${i.diet==='egg'?'selected':''}>Contains egg</option></select></div><div><label>Photo (JPG/PNG/WebP, max 4 MB)</label><input type="file" id="f_f" accept="image/jpeg,image/png,image/webp"></div></div><div id="pv" class="mut">${i.image?`<img src="${esc(i.image)}" style="height:80px;border-radius:8px">`:'No photo yet'}</div><input type="hidden" id="f_im" value="${esc(i.image)}"><div class="acts"><button class="btn" onclick="saveItem(${id||0})">Save</button><button class="btn alt" onclick="closeM()">Cancel</button>${id?`<button class="btn red" style="margin-left:auto" onclick="delItem(${id})">Delete</button>`:''}</div></div>`;$('#md').classList.add('on');
  $('#f_f').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4e6)return toast('Image must be under 4 MB',1);const r=new FileReader();r.onload=async()=>{try{const j=await api('/upload','POST',{dataUrl:r.result});$('#f_im').value=j.url;$('#pv').innerHTML=`<img src="${j.url}" style="height:80px;border-radius:8px">`}catch(x){toast(x.message,1)}};r.readAsDataURL(f)}}
const closeM=()=>$('#md').classList.remove('on');
async function saveItem(id){const b={name:$('#f_n').value,category:$('#f_c').value,price:$('#f_p').value,desc:$('#f_d').value,ingredients:$('#f_i').value,diet:$('#f_t').value,image:$('#f_im').value};
  try{if(id)await api('/items/'+id,'PUT',b);else await api('/items','POST',b);closeM();await refresh();toast('Saved')}catch(e){toast(e.message,1)}}
async function delItem(id){if(!confirm('Delete this dish permanently? (To hide it temporarily, switch off "On today\'s menu".)'))return;await api('/items/'+id,'DELETE');closeM();await refresh()}
// ---- tables ----
function vTables(){return `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><h3 style="margin:0;flex:1">Tables & QR codes</h3><button class="btn" onclick="addTable()">+ Add table</button><button class="btn alt" onclick="printQR()">🖨 Print all QR</button><button class="btn alt" onclick="rotAll()">Regenerate all codes</button></div><div class="card"><p class="mut" style="margin-top:0">Each table has its own secret QR code. Orders are only accepted from active codes. If a code is shared or leaked, regenerate it and reprint.</p><table>${S.tables.map(t=>`<tr><td><input value="${esc(t.label)}" maxlength="30" style="max-width:160px" onchange="tb(${t.id},{label:this.value})"></td><td><label class="sw"><input type="checkbox" ${t.active?'checked':''} onchange="tb(${t.id},{active:this.checked})"><span></span></label> <span class="mut">active</span></td><td class="acts"><button class="btn alt" style="padding:6px 12px" onclick="showQR(${t.id})">View QR</button><button class="btn alt" style="padding:6px 12px" onclick="confirm('Old printed code will stop working. Continue?')&&tb(${t.id},{rotate:1})">Regenerate</button><button class="btn alt" style="padding:6px 12px" onclick="confirm('Delete table?')&&delT(${t.id})">Delete</button></td></tr>`).join('')}</table></div>`}
async function tb(id,p){try{const t=await api('/tables/'+id,'PUT',p);Object.assign(S.tables.find(x=>x.id===id),t);toast('Saved');if(p.rotate)draw()}catch(e){toast(e.message,1)}}
async function addTable(){const l=prompt('Table name (e.g. Table 9 or Window 2)');if(!l)return;try{await api('/tables','POST',{label:l});refresh()}catch(e){toast(e.message,1)}}
async function delT(id){await api('/tables/'+id,'DELETE');refresh()}
async function rotAll(){if(!confirm('All printed QR codes will stop working until you reprint them. Continue?'))return;S.tables=await api('/tables-rotate-all','POST');draw();toast('All codes regenerated')}
async function showQR(id){const t=S.tables.find(x=>x.id===id),q=await api('/qr/'+id);$('#mb').innerHTML=`<div style="text-align:center"><div class="wm"><b>SŌKO</b><small>COFFEE</small></div><h3 style="margin-top:14px">${esc(t.label)}</h3><img src="${q.png}" style="width:240px" alt="QR"><p class="mut" style="word-break:break-all">${esc(q.url)}</p><button class="btn" onclick="printQR(${id})">Print</button> <button class="btn alt" onclick="closeM()">Close</button></div>`;$('#md').classList.add('on')}
async function printQR(only){const ts=only?S.tables.filter(t=>t.id===only):S.tables.filter(t=>t.active),cards=[];for(const t of ts){const q=await api('/qr/'+t.id);cards.push(`<div class="c"><div class="w">SŌKO<small>COFFEE</small></div><img src="${q.png}"><h2>${esc(t.label)}</h2><p>Scan to view the menu &amp; order</p><em>Coffee. Crafted Better.</em></div>`)}
  const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print',1);w.document.write(`<!doctype html><title>QR codes</title><style>body{margin:0;font-family:Georgia,serif;color:#234D43}.c{display:inline-block;width:92mm;height:128mm;margin:3mm;border:1px solid #B98252;border-radius:6mm;text-align:center;padding:8mm 6mm;box-sizing:border-box;background:#F0E7D2;page-break-inside:avoid;vertical-align:top}.w{font-size:30px;letter-spacing:.1em;font-weight:bold}.w small{display:block;font-size:8px;letter-spacing:.5em;margin-top:4px}img{width:62mm;margin:6mm 0 2mm;background:#fff;padding:2mm;border-radius:3mm}h2{margin:2mm 0}p{margin:0;font:13px sans-serif;color:#332820}em{display:block;margin-top:6mm;font-size:11px;color:#B98252}</style>${cards.join('')}<script>onload=()=>setTimeout(print,400)<\/script>`);w.document.close()}
// ---- settings ----
function vSettings(){const s=S.settings;return `<div class="cols"><div class="card"><h3>Café details</h3><div class="g"><div><label>Café name</label><input id="s_name" value="${esc(s.name)}"></div><div><label>Tagline</label><input id="s_tag" value="${esc(s.tagline)}"></div><div><label>Café phone</label><input id="s_ph" value="${esc(s.phone)}" inputmode="tel"></div><div><label>Café email</label><input id="s_em" value="${esc(s.email)}" type="email"></div><div><label>Tax % added to orders (0 if prices include tax)</label><input id="s_tax" type="number" min="0" max="50" step="0.5" value="${s.taxPercent}"></div><div><label>Website address for QR codes (e.g. https://order.yourcafe.com)</label><input id="s_url" value="${esc(s.publicUrl)}" placeholder="auto-detected"></div></div></div>
<div class="card"><h3>Order alerts</h3><div class="g"><div><label>Send new-order emails to</label><input id="s_ne" type="email" value="${esc(s.notifyEmail)}"></div><div><label>Staff phone (for reference)</label><input id="s_np" value="${esc(s.notifyPhone)}" inputmode="tel"></div><p class="mut" style="margin:0">Live alerts (sound + pop-up) work on this admin page. Emails need SMTP set on the server ${S.mailReady?'<b style="color:var(--green)">(configured ✓)</b>':'<b style="color:var(--red)">(not configured)</b>'}. SMS/WhatsApp require a paid provider and are not included.</p><label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--esp)"><span class="sw"><input type="checkbox" id="s_open" ${s.open?'checked':''}><span></span></span>Accepting orders</label><button class="btn" onclick="saveSet()">Save settings</button></div></div>
<div class="card"><h3>Change admin password</h3><div class="g"><input id="np" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password"><button class="btn" onclick="chPw()">Update password</button></div></div></div>`}
async function saveSet(){try{S.settings=await api('/settings','PUT',{name:$('#s_name').value,tagline:$('#s_tag').value,phone:$('#s_ph').value,email:$('#s_em').value,taxPercent:$('#s_tax').value,publicUrl:$('#s_url').value,notifyEmail:$('#s_ne').value,notifyPhone:$('#s_np').value,open:$('#s_open').checked});toast('Settings saved')}catch(e){toast(e.message,1)}}
async function chPw(){try{const j=await api('/password','POST',{password:$('#np').value});tok=j.token;sessionStorage.setItem('sk_admin',tok);S.defaultPassword=false;if(es)es.close();es=null;await start();toast('Password updated')}catch(e){toast(e.message,1)}}
if(tok)start();
</script></body></html>
