<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SŌKO COFFEE</title><meta name="theme-color" content="#F0E7D2">
<link rel="stylesheet" href="/brand.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
header{padding:18px 16px 10px;text-align:center;position:relative}.tb{position:absolute;right:14px;top:18px;background:var(--teal);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.chips{position:sticky;top:0;z-index:5;background:var(--iv);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}.chips button{white-space:nowrap;border:1px solid var(--teal);background:none;color:var(--teal);border-radius:20px;padding:7px 14px;font-size:13px}.chips button.on{background:var(--teal);color:#fff}
main{padding:6px 14px 120px;max-width:720px;margin:auto}h2{font:600 18px 'DejaVu Serif',Georgia,serif;color:var(--teal);margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase}
.it{display:flex;gap:12px;background:var(--sw);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #3328200d}.it.so{opacity:.55}
.ph{flex:none;width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,var(--teal),#2E6154);display:grid;place-items:center;color:var(--iv);font:600 26px 'DejaVu Serif',serif;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.in{flex:1;min-width:0;display:flex;flex-direction:column}.nm{font-weight:600}.ds{font-size:12.5px;color:#6B5E52;margin:2px 0 6px}.row{margin-top:auto;display:flex;justify-content:space-between;align-items:center}.pr{font-weight:600;color:var(--car);font-size:17px}
.q{display:flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border-radius:10px}.q button{background:none;border:0;color:#fff;width:34px;height:34px;font-size:20px}.add{background:#fff;color:var(--teal);border:1px solid var(--teal);border-radius:10px;padding:7px 18px;font-weight:600}
.tag{font-size:11px;color:var(--red);font-weight:600}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:696px;margin:auto;display:none}#bar button{width:100%;display:flex;justify-content:space-between;padding:15px 18px;border-radius:16px;box-shadow:0 6px 20px #23352e55}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet.on{display:flex}.sp{background:var(--sw);width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.tot{font-weight:600;font-size:17px}.f{display:grid;gap:8px;margin:14px 0}.err{background:#fbe9e5;color:var(--red);padding:10px 12px;border-radius:10px;margin:10px 0}
.full{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}.steps{display:flex;margin:22px 0;gap:6px}.steps div{flex:1;font-size:11px;color:#9a8e80}.steps i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}.steps .on{color:var(--teal);font-weight:600}.steps .on i{background:var(--teal)}
</style></head><body>
<header><span class="tb" id="tb"></span><div class="wm"><b>SŌKO</b><small>COFFEE</small></div></header>
<div id="app"><div class="full">Loading menu…</div></div>
<div id="bar"><button class="btn" onclick="openCart()"><span id="bc"></span><span id="bt"></span></button></div>
<div class="sheet" id="sh"><div class="sp" id="sp"></div></div>
<script>
const T=location.pathname.split('/')[2],$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M,cart={},ord=null,poll=null;const KEY='soko_'+T;
const inr=n=>'₹'+(Math.round(n*100)/100).toString();
async function api(u,o){const r=await fetch(u,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Something went wrong. Please try again.');return j}
async function init(){
  try{M=await api('/api/menu?t='+encodeURIComponent(T))}catch(e){$('#app').innerHTML=`<div class="full"><div><h2>Oops</h2><p>${esc(e.message)}</p></div></div>`;return}
  $('#tb').textContent=M.table;try{ord=JSON.parse(sessionStorage.getItem(KEY))}catch{}
  if(ord&&Date.now()-ord.createdAt<4*3600e3)return track();ord=null;render()
}
function render(){
  const cats=M.categories.filter(c=>M.items.some(i=>i.category===c));
  let h=M.cafe.open?'':'<div class="err">We are not taking orders right now. You can still browse the menu.</div>';
  h+=`<div class="chips">${cats.map((c,i)=>`<button class="${i?'':'on'}" onclick="go(this,${i})">${esc(c)}</button>`).join('')}</div><main>`;
  cats.forEach((c,i)=>{h+=`<h2 id="c${i}">${esc(c)}</h2>`+M.items.filter(x=>x.category===c).map(card).join('')});
  $('#app').innerHTML=h+'</main>';bar()
}
function card(i){const q=cart[i.id]||0,so=!i.inStock;
  return `<div class="it ${so?'so':''}"><div class="ph">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy">`:esc(i.name[0])}</div><div class="in"><div class="nm"><span class="dot ${i.diet}"></span> ${esc(i.name)}</div><div class="ds">${esc(i.desc)}</div><div class="row"><span class="pr">${inr(i.price)}</span>${so?'<span class="tag">SOLD OUT</span>':q?`<div class="q"><button onclick="chg(${i.id},-1)" aria-label="Remove one">−</button><b>${q}</b><button onclick="chg(${i.id},1)" aria-label="Add one">+</button></div>`:`<button class="add" ${M.cafe.open?'':'disabled'} onclick="chg(${i.id},1)">Add</button>`}</div></div></div>`}
function go(b,i){document.querySelectorAll('.chips button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const e=$('#c'+i);window.scrollTo({top:e.offsetTop-52,behavior:'smooth'})}
function chg(id,d){const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n<=20)cart[id]=n;const y=scrollY;render();scrollTo(0,y);if($('#sh').classList.contains('on'))openCart()}
const lines=()=>Object.entries(cart).map(([id,q])=>({i:M.items.find(x=>x.id==id),q})).filter(l=>l.i);
function sum(){const s=lines().reduce((a,l)=>a+l.i.price*l.q,0),t=Math.round(s*M.cafe.taxPercent)/100;return{s,t,n:lines().reduce((a,l)=>a+l.q,0)}}
function bar(){const{s,t,n}=sum();$('#bar').style.display=n?'block':'none';$('#bc').textContent=`View order · ${n} item${n>1?'s':''}`;$('#bt').textContent=inr(s+t)}
function openCart(err){
  const{s,t,n}=sum();if(!n){$('#sh').classList.remove('on');return}
  $('#sp').innerHTML=`<h2 style="margin-top:0">Your order · ${esc(M.table)}</h2>${lines().map(l=>`<div class="ln"><span>${esc(l.i.name)}<br><small>${inr(l.i.price)}</small></span><span class="q"><button onclick="chg(${l.i.id},-1)">−</button><b>${l.q}</b><button onclick="chg(${l.i.id},1)">+</button></span></div>`).join('')}
  ${M.cafe.taxPercent?`<div class="ln"><span>Tax (${M.cafe.taxPercent}%)</span><span>${inr(t)}</span></div>`:''}<div class="ln tot"><span>Total</span><span>${inr(s+t)}</span></div>
  <div class="f"><input id="cn" placeholder="Your name (optional)" maxlength="60" autocomplete="name"><input id="cp" placeholder="Phone (optional)" inputmode="tel" maxlength="20" autocomplete="tel"><input id="ce" placeholder="Email for confirmation (optional)" type="email" maxlength="100" autocomplete="email"><textarea id="no" rows="2" placeholder="Any request? (e.g. less sugar)" maxlength="300"></textarea></div>
  ${typeof err==='string'?`<div class="err">${esc(err)}</div>`:''}<button class="btn" style="width:100%" id="pb" onclick="place()">Place order</button><button class="btn alt" style="width:100%;margin-top:8px" onclick="$('#sh').classList.remove('on')">Keep browsing</button>`;
  $('#sh').classList.add('on')}
async function place(){
  const b=$('#pb');b.disabled=true;b.textContent='Placing…';
  try{const r=await api('/api/order',{t:T,items:lines().map(l=>({id:l.i.id,qty:l.q})),note:$('#no').value,customer:{name:$('#cn').value,phone:$('#cp').value,email:$('#ce').value}});
    ord=r.order;sessionStorage.setItem(KEY,JSON.stringify(ord));cart={};$('#sh').classList.remove('on');$('#bar').style.display='none';track()}
  catch(e){openCart(e.message);if(/stock|available/i.test(e.message))init()}
}
const S=['new','preparing','ready','served'],L={new:'Received',preparing:'Preparing',ready:'Ready',served:'Served'};
function track(){
  const done=ord.status==='cancelled',i=S.indexOf(ord.status);
  $('#app').innerHTML=`<div class="full"><div style="max-width:420px;width:100%"><div style="font-size:46px">${done?'✕':'✓'}</div><h2 style="margin:6px 0">${done?'Order cancelled':'Order confirmed'}</h2><p>Order <b>${esc(ord.no)}</b> · ${esc(ord.table)}<br>${done?'Please speak to our staff.':ord.status==='ready'?'Your order is ready!':'We are on it. This page updates automatically.'}</p>
  ${done?'':`<div class="steps">${S.map((s,k)=>`<div class="${k<=i?'on':''}"><i></i>${L[s]}</div>`).join('')}</div>`}
  <div style="text-align:left;background:var(--sw);border-radius:14px;padding:12px 14px">${ord.items.map(l=>`<div class="ln"><span>${l.qty} × ${esc(l.name)}</span><span>${inr(l.qty*l.price)}</span></div>`).join('')}<div class="ln tot"><span>Total</span><span>${inr(ord.total)}</span></div></div>
  <button class="btn alt" style="margin-top:16px" onclick="again()">Order more</button></div></div>`;
  clearInterval(poll);if(!['served','cancelled'].includes(ord.status))poll=setInterval(async()=>{try{const r=await api(`/api/order/${ord.id}?t=${encodeURIComponent(T)}`);if(r.order.status!==ord.status){ord=r.order;sessionStorage.setItem(KEY,JSON.stringify(ord));track();if(ord.status==='ready'&&navigator.vibrate)navigator.vibrate(300)}}catch{}},5000)
}
function again(){clearInterval(poll);sessionStorage.removeItem(KEY);ord=null;init()}
init();
</script></body></html>
